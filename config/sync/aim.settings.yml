_core:
  default_config_hash: 9rxau6suBuKY1bOibxUrrGht2Y9eWAeaF074tubOJ9I
auto_threshold: 0.09
ambiguous_threshold: 0.45
neighbor_limit: 3
merge_verify: true
activities:
  extraction:
    backend: chat
    provider: ''
    model: ''
  consolidation:
    backend: decision
    provider: typesafeai
    model: subq-snap-preview
  verifier:
    backend: decision
    provider: typesafeai
    model: subq-snap-preview
    threshold: 0.8
  grounding:
    backend: decision
    provider: typesafeai
    model: subq-snap-preview
    threshold: 0.7
grounding_mode: shadow
merge_max_distance: 0.0
merge_prompt: "Merge these two memory facts into one short sentence that keeps every detail\r\nof both (names, numbers, dates, conditions, negations) and adds nothing else.\r\nIf they conflict, the newer fact wins.\r\n\r\nExisting fact: \"{kept_text}\"\r\nNewer fact: \"{candidate_text}\"\r\n"
merge_verify_prompt: |
  A memory system proposes replacing two facts with one merged fact.
  Judge only faithfulness to the inputs, not whether they are true.

  Fact A: "{kept_text}"
  Fact B: "{candidate_text}"
  Merged: "{merged_text}"

  Set faithful to true only if every detail of Fact A and Fact B survives in
  Merged (names, numbers, dates, conditions, negations) and Merged adds
  nothing that neither fact states, except where Fact B plainly corrects or
  supersedes a detail of Fact A. A value in Fact B that differs from Fact A's
  value for the same attribute (a duration, day, price or place) supersedes it:
  the old value must not appear in Merged, and its absence is not a lost detail.
  Otherwise set faithful to false.
recall_max_distance: 0.52
recall_gap: 0.1
default_trusted: true
trust_policy:
  default: ''
  channels:
    chat: hold
  scopes: {  }
show_redacted_facts: false
log_audit: true
log_verbose: true
log_query_text: false
extraction_prompt: "Extract every discrete, atomic fact worth remembering long-term from the text below.\r\nEach fact must be one short sentence that makes sense with no other context: say what it is about (a product, team or role, never \"it\", \"they\" or \"that channel\"), and never refer to \"the above\" or to another fact.\r\nDo not add names, organizations or other identifying details that the fact does not need to make sense.\r\nKeep uncertainty in the fact: if the text says something is planned, possible or undecided, say so in the sentence.\r\nDo not invent facts the text does not support. If nothing is worth remembering, return an empty facts array.\r\n\r\nFor each fact, classify its scope:\r\n- \"user\": specific to one named person.\r\n- \"role\": true for everyone holding a particular role.\r\n- \"site\": about the site or organization itself, not one person.\r\n- \"case\": tied to a specific project, case or tracked issue, named by the caller.\r\n\r\nAlso give a short \"subject\"; for:\r\n- \"user\" scope, the person's name or identifier\r\n- \"role\", the role name\r\n- \"case\", only an identifier given in the text or by the caller; never invent one. If none is given, use \"site\" scope instead\r\n- \"site\", leave it empty\r\n\r\nText:\r\n\"\"\"\r\n{text}\r\n\"\"\"\r\n"
consolidation_prompt: "Two memory facts about the same scope and subject were flagged as possibly related. Decide what to do with the candidate fact relative to the existing one.\r\n\r\nExisting fact: \"{kept_text}\"\r\nCandidate fact: \"{candidate_text}\"\r\n\r\nChoose one decision:\r\n- \"ADD\": the two facts are genuinely different and both should be   kept as-is.\r\n- \"UPDATE\": the candidate refines, corrects, or supersedes the existing fact\r\n(e.g. a changed preference). Provide a single merged statement in merged_text\r\nthat replaces the existing fact's text.\r\n- \"NOOP\": the candidate simply restates the existing fact with no new information.\r\nThe existing fact stands unchanged and the candidate is redundant.\r\n- \"RETIRE\": the candidate fact should not exist as a memory at all\r\n(e.g. nonsensical or clearly erroneous). Use sparingly.\r\n\r\nIf both facts state a different value for the same attribute of the same thing\r\n(a day, time, number, place or name), they cannot both be true: choose \"UPDATE\",\r\nwith the candidate's value in merged_text. This holds even when the existing fact\r\nsays more than the candidate: keep the rest of the existing fact and change only\r\nthe conflicting value.\r\n\r\nWhen unsure whether the candidate is a refinement or a distinct fact, choose \"ADD\":\r\nmerging is where nuance is lost, and keeping both facts is always safe.\r\n\r\nFor any decision other than UPDATE, set merged_text to the existing fact's text unchanged.\r\n"
user_scope_shared_role_fallback: true
user_scope_role_visibility: {  }
