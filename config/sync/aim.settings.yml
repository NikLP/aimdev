auto_threshold: 0.09
ambiguous_threshold: 0.45
neighbor_limit: 3
merge_verify: true
activities:
  extraction:
    backend: chat
    provider: ''
    model: ''
  consolidation:
    backend: decision
    provider: typesafeai
    model: jev-latest
  verifier:
    backend: decision
    provider: typesafeai
    model: jev-latest
    threshold: 0.8
merge_max_distance: 0.0
merge_prompt: |
  Merge these two memory facts into one short sentence that keeps every detail
  of both (names, numbers, dates, conditions, negations) and adds nothing else.
  If they conflict, the newer fact wins.

  Existing fact: "{kept_text}"
  Newer fact: "{candidate_text}"
merge_verify_prompt: |
  A memory system proposes replacing two facts with one merged fact.
  Judge only faithfulness to the inputs, not whether they are true.

  Fact A: "{kept_text}"
  Fact B: "{candidate_text}"
  Merged: "{merged_text}"

  Set faithful to true only if every detail of Fact A and Fact B survives in
  Merged (names, numbers, dates, conditions, negations) and Merged adds
  nothing that neither fact states, except where Fact B plainly corrects or
  supersedes a detail of Fact A. Otherwise set faithful to false.
recall_max_distance: 0.48
default_trusted: true
log_audit: true
log_verbose: true
log_query_text: true
extraction_prompt: "Extract every discrete, atomic fact worth remembering long-term from the text below.\r\nEach fact must be one short sentence that makes sense with no other context: name the subject in full (a product, team or role, never \"it\", \"they\" or \"that channel\"), and never refer to \"the above\" or to another fact.\r\nKeep uncertainty in the fact: if the text says something is planned, possible or undecided, say so in the sentence.\r\nDo not invent facts the text does not support. If nothing is worth remembering, return an empty facts array.\r\n\r\nFor each fact, classify its scope:\r\n- \"user\": specific to one named person.\r\n- \"role\": true for everyone holding a particular role.\r\n- \"site\": about the site or organization itself, not one person.\r\n- \"case\": tied to a specific project, case or tracked issue, named by the caller.\r\n\r\nAlso give a short \"subject\" for:\r\n- \"user\" scope, the person's name or identifier\r\n- \"role\", the role name\r\n- \"case\", only an identifier given in the text or by the caller; never invent one. If none is given, use \"site\" scope instead\r\n- \"site\", leave it empty\r\n\r\nText:\r\n\"\"\"\r\n{text}\r\n\"\"\"\r\n"
consolidation_prompt: "Two memory facts about the same scope and subject were flagged as possibly related.\r\nDecide what to do with the candidate fact relative to the existing one.\r\n\r\nExisting fact: \"{kept_text}\"\r\nCandidate fact: \"{candidate_text}\"\r\n\r\nChoose one decision:\r\n- \"ADD\": the two facts are genuinely different and both should be   kept as-is.\r\n- \"UPDATE\": the candidate refines, corrects, or supersedes the existing fact\r\n(e.g. a changed preference). Provide a single merged statement in merged_text\r\nthat replaces the existing fact's text.\r\n- \"NOOP\": the candidate simply restates the existing fact with no new information.\r\nThe existing fact stands unchanged and the candidate is redundant.\r\n- \"DELETE\": the candidate fact should not exist as a memory at all\r\n(e.g. nonsensical or clearly erroneous). Use sparingly.\r\n\r\nWhen unsure whether the candidate is a refinement or a distinct fact, choose \"ADD\":\r\nmerging is where nuance is lost, and keeping both facts is always safe.\r\n\r\nFor any decision other than UPDATE, set merged_text to the existing fact's text unchanged.\r\n"
user_scope_shared_role_fallback: true
user_scope_role_visibility: {  }
