auto_threshold: 0.09
ambiguous_threshold: 0.45
recall_max_distance: 0.48
extraction_prompt: "Extract every discrete, atomic fact worth remembering long-term from the text below.\r\nEach fact must be one short, self-contained sentence.\r\nDo not invent facts the text does not support. If nothing is worth remembering, return an empty facts array.\r\n\r\nFor each fact, classify its scope:\r\n- \"user\": specific to one named person.\r\n- \"role\": true for everyone holding a particular role.\r\n- \"site\": about the site or organization itself, not one person.\r\n- \"case\": tied to a specific support case or tracked issue.\r\n\r\nAlso give a short \"subject\" for:\r\n- \"user\" scope, the person's name or identifier\r\n- \"role\", the role name\r\n- \"case\", a case identifier\r\n- \"site\", leave it empty\r\n\r\nText:\r\n\"\"\"\r\n{text}\r\n\"\"\"\r\n"
consolidation_prompt: "Two memory facts about the same scope and subject were flagged as possibly related.\r\nDecide what to do with the candidate fact relative to the existing one.\r\n\r\nExisting fact: \"{kept_text}\"\r\nCandidate fact: \"{candidate_text}\"\r\n\r\nChoose one decision:\r\n- \"ADD\": the two facts are genuinely different and both should be   kept as-is.\r\n- \"UPDATE\": the candidate refines, corrects, or supersedes the existing fact\r\n(e.g. a changed preference). Provide a single merged statement in merged_text\r\nthat replaces the existing fact's text.\r\n- \"NOOP\": the candidate simply restates the existing fact with no new information.\r\nThe existing fact stands unchanged and the candidate is redundant.\r\n- \"DELETE\": the candidate fact should not exist as a memory at all\r\n(e.g. nonsensical or clearly erroneous). Use sparingly.\r\n\r\nFor any decision other than UPDATE, set merged_text to the existing fact's text unchanged.\r\n"
user_scope_shared_role_fallback: true
user_scope_role_visibility: {  }
