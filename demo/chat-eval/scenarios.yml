# Multi-turn chat scenarios for `drush aim:chatbot-converse`, against this
# site's aim_demo_library facts and literals. Each scenario is one thread.
# Per turn: any (one of these substrings, case-insensitive), all, not (none
# of these), literal (a literal key whose value must appear).
as: 1
scenarios:
  - name: sunday-then-phone
    turns:
      - q: "Are you open on Sundays?"
        any: ["12", "noon"]
      - q: "What's your phone number?"
        literal: main_phone
  - name: phone-first
    turns:
      - q: "What's your phone number?"
        literal: main_phone
  - name: offtopic-then-hours
    turns:
      - q: "Capital of Australia"
        not: ["Canberra"]
      - q: "When are you open on Saturday?"
        all: ["10", "5"]
  - name: wifi
    turns:
      - q: "What's the Wi-Fi password?"
        any: ["no password", "isn't a password", "doesn't need", "does not need", "need a password", "without a password"]
  - name: printer-followup
    turns:
      - q: "Do you have 3D printers?"
        any: ["induction"]
      - q: "How long does the induction take?"
        any: ["20"]
  - name: borrowing-followup
    turns:
      - q: "How many books can I borrow?"
        any: ["20"]
      - q: "And for how long?"
        any: ["3 weeks", "three weeks"]
  - name: kids-followup
    turns:
      - q: "Is there anything for kids on Thursdays?"
        any: ["Code Club"]
      - q: "What ages is it for?"
        all: ["9", "13"]
  - name: dog-then-fines
    turns:
      - q: "Can I bring my dog in?"
        any: ["assistance"]
      - q: "Do you charge late fines?"
        any: ["2022", "no longer", "stopped", "don't charge", "do not charge"]
  - name: room-then-number
    turns:
      - q: "Can my community group book a meeting room?"
        any: ["free", "4 hours", "four hours"]
      - q: "What number do I call to book it?"
        literal: reservations_phone
  - name: wifi-after-hours
    turns:
      - q: "What time do you close on weekdays?"
        any: ["8pm", "8 pm", "8:00"]
      - q: "Is there Wi-Fi?"
        any: ["Harbourside_Public"]
  # Broad questions and questions with no recorded answer (added 2026-10-27,
  # from demo/recall-eval's misses).
  - name: events
    turns:
      - q: "Any upcoming events?"
        all: ["Code Club", "Rhyme Time"]
  - name: kids-this-week
    turns:
      - q: "What's on for kids this week?"
        all: ["Code Club", "Rhyme Time"]
  - name: services
    turns:
      - q: "What services do you offer?"
        any: ["computer", "Wi-Fi", "meeting room", "3D print"]
  - name: wheelchair
    turns:
      - q: "Is there wheelchair access?"
        any: ["step-free", "step free"]
  - name: parking-unknown
    turns:
      - q: "Where can I park?"
        any: ["don't have", "do not have", "no information", "not sure", "couldn't find", "could not find", "can't find", "don't know", "not recorded", "no details"]
  - name: cafe-unknown
    turns:
      - q: "Do you have a cafe?"
        any: ["don't have", "do not have", "no information", "not sure", "couldn't find", "could not find", "can't find", "don't know", "not recorded", "no details"]
